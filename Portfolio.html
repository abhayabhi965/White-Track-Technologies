<html>
    <head>

        <style>

                height:500px;
                width:1000px;
                border-radius:20px;

                position:relative;

            }

                margin:150px 0px 0px 50px;

            .img{
                position:absolute;
                right:50px;
                top:50%;
                transform:translateY(-50%);
                
            }
            nav{
                display:flex;
                justify-content:space-between;
                
            }
            nav ul{
                display:flex;
                list-style:none; 
                gap:30px;       
            }
            nav ul li a{
                text-decoration:none;
                color:blue;
                font-weight:bold;
                
            }
            .Footer{
                border-top:1px solid black;
                position:absolute;
                bottom:5px;
                right:0px;
                left:0px;
                padding:10px;
            }
            .Footer a{
                margin-left:20px;
            }

    <body>
        <div class="main">
            <div style="border-bottom:1px solid black;">
                <nav>
                    <ul>
                        <li><a href="#Home">Home</a></li>

            </div>

            </div>
            <div class="Footer">
                <a href="https://www.linkedin.com/in/abhay-anil-688591393/"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png"  width="30" height="30"></a>
                <a href="https://www.instagram.com/abhay._.anil"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" width="30" height="30"></a>
            </div>
            <div class="img">
                <img src="Abhayportfolio.png" height="350" width="350">
            </div>
        </div>
        
       
        
    </body>
</html>
